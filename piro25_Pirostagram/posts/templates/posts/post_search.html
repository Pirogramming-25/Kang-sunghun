{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>게시글 검색 - Pirostagram</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="search-page">
        <h1 class="logo search-logo">Pirostagram</h1>

        {% if query %}
            <h2 class="search-title">"{{ query }}"로 검색한 게시글</h2>
        {% endif %}

        {% for post in results %}
            <div class="user-card">
                <img src="{{ post.image.url }}" class="user-card-photo search-post-image">
                <div class="user-card-info">
                    <a href="{% url 'accounts:profile' post.author.username %}"><strong>{{ post.author.username }}</strong></a>
                    <p>{{ post.content }}</p>
                    <p class="post-date">{{ post.created_at }}</p>
                </div>
            </div>
        {% empty %}
            <p>검색 결과가 없습니다.</p>
        {% endfor %}

        <a href="{% url 'posts:feed' %}" class="back-link">홈으로 돌아가기</a>
    </div>

</body>
</html>
