{% extends "my_gpt/base.html" %}

{% block title %}로그인 | Django GPT{% endblock %}

{% block content %}
  <h1>🔑 로그인</h1>

  {% if request.GET.required == "1" %}
    <script>
      alert("로그인 후 이용해주세요");
    </script>
  {% endif %}

  {% if form.errors %}
    <div class="error-box">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  {% endif %}

  <form method="post" class="login-form">
    {% csrf_token %}

    <label for="id_username">아이디</label>
    {{ form.username }}

    <label for="id_password">비밀번호</label>
    {{ form.password }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit" class="btn">로그인</button>
  </form>
{% endblock %}
