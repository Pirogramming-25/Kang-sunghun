{% extends 'IdeaSite/base.html' %}

{% block content %}

<h1>DevTool Detail Update</h1>
<p>개발툴 세부내용 수정 페이지입니다. 개발툴에 대해 수정사항이 있으면 고쳐보아요.</p>

<form method="POST">
    {% csrf_token %}
    <p>이름: <input type="text" name="name" value="{{ devtool.name }}"></p>
    <p>종류: <input type="text" name="kind" value="{{ devtool.kind }}"></p>
    <p>개발툴 설명: <textarea name="content">{{ devtool.content }}</textarea></p>
    <button type="submit">SUBMIT</button>
</form>
{% endblock %}
