{% extends 'IdeaSite/base.html' %}

{% block content %}

<h1>Idea Register</h1>
<p>아이디어 등록 페이지 입니다. 당신의 아이디어를 잊지 말고 기록해보세요.</p>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <p>아이디어명: <input type="text" name="title"></p>
    <p>Image: <input type="file" name="image"></p>
    <p>아이디어 설명: <textarea name="content"></textarea></p>
    <p>아이디어 관심도: <input type="number" name="interest" value="0"></p>
    <p>예상 개발툴:
        <select name="devtool">
            {% for devtool in devtools %}
                <option value="{{ devtool.id }}">{{ devtool.name }}</option>
            {% endfor %}
        </select>
    </p>
    <button type="submit">SUBMIT</button>
</form>
{% endblock %}
